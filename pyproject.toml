[project]
name = "oscar"
version = "0.1.0"
description = "Auditor forense de actas E14 (Colombia)"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pikepdf>=8.0",
    "imagehash>=4.3",
    "pytesseract>=0.3.10",
    "paddleocr>=2.7",
    "torch>=2.2",
    "scipy>=1.12",
    "pandas>=2.2",
    "rapidfuzz>=3.6",
    "rich>=13.7",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
oscar = "oscar.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oscar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
